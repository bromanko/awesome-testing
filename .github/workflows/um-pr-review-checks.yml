name: Check UM review integration
on:
  pull_request:
    paths: ['.um/**', '.github/workflows/um-pr-review*.yml']
  push:
    branches: [master]
    paths: ['.um/**', '.github/workflows/um-pr-review*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Offline tests, no provider key or privileged PR context
        run: python3 -m unittest discover -s .um/awesome-testing/tests -v
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA" -- .um/ .github/workflows/um-pr-review.yml .github/workflows/um-pr-review-checks.yml
