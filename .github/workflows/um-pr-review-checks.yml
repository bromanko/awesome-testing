name: Check UM review integration
on:
  pull_request:
    paths: ['.um/**', '.github/workflows/um-pr-review*.yml']
  push:
    branches: [master]
    paths: ['.um/**', '.github/workflows/um-pr-review*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests, no provider key or privileged PR context
        run: python3 -m unittest discover -s .um/awesome-testing/tests -v
